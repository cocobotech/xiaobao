<title>COCOBO 单词</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Noto+Sans:wght@400;500&family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>
:root{
  --ground:#F2F6FB; --surface:#FFFFFF; --surface2:#E9EFF6; --ink:#1B2838; --muted:#5E6E82; --line:#D8E1EC;
  --accent:#FF8A3D; --accent-ink:#FFFFFF; --accent-soft:#FFF0E4; --blue:#3D6BFF; --blue-soft:#E7EDFF;
  --ok:#2FA36B; --ok-soft:#DFF5E9; --bad:#E0452E; --bad-soft:#FBE3DF;
  --shadow:0 10px 30px rgba(27,40,56,.10), 0 2px 6px rgba(27,40,56,.06);
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141B25; --surface:#1D2734; --surface2:#26313F; --ink:#EEF3F9; --muted:#93A3B6; --line:#2E3B4C;
    --accent:#FF9A55; --accent-ink:#1B1208; --accent-soft:#3A2717; --blue:#7C9BFF; --blue-soft:#25304D;
    --ok:#4FC28A; --ok-soft:#1C3A2C; --bad:#F06A55; --bad-soft:#442119;
    --shadow:0 10px 30px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ground:#141B25; --surface:#1D2734; --surface2:#26313F; --ink:#EEF3F9; --muted:#93A3B6; --line:#2E3B4C;
  --accent:#FF9A55; --accent-ink:#1B1208; --accent-soft:#3A2717; --blue:#7C9BFF; --blue-soft:#25304D;
  --ok:#4FC28A; --ok-soft:#1C3A2C; --bad:#F06A55; --bad-soft:#442119;
  --shadow:0 10px 30px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Nunito",-apple-system,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ipa{font-family:"Noto Sans","Charis SIL","Doulos SIL","Segoe UI",sans-serif}
/* 汉字：用衬线体，笔画结构更接近课本字形 */
.hz{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;font-weight:600}
.face .word.hz{font-size:clamp(72px,16vh,190px);letter-spacing:.04em;line-height:1.05}
.type-meta .zh.hz{font-family:"Noto Serif SC","Songti SC",serif;font-size:40px;font-weight:600;line-height:1.1}
.feedback .ans.hz{font-family:"Noto Serif SC","Songti SC",serif;font-size:30px;font-weight:600}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:minmax(150px,1fr) 5fr;height:100dvh;overflow:hidden}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px 10px;border-bottom:1px solid var(--line)}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-weight:700;font-size:18px;flex:none}
.brand b{font-family:"Fredoka",sans-serif;font-weight:600;font-size:17px;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tree{flex:1;overflow:auto;padding:8px 8px 16px}
.tree-label{display:flex;align-items:center;gap:6px;width:100%;font-size:11px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);padding:9px 8px 6px;border-radius:10px;text-align:left}
.tree-label:hover{background:var(--surface2);color:var(--ink)}
.tree-label .chev{width:11px;flex:none;transition:transform .18s}
.tgroup.open>.tree-label .chev{transform:rotate(90deg)}
.tree-label span{flex:1;min-width:0}
.tree-label em{font-style:normal;opacity:.7;letter-spacing:0}
.tgroup-body{display:none;padding-bottom:4px}
.tgroup.open .tgroup-body{display:block}
.book{border-radius:12px;margin-bottom:4px}
.book-head{display:flex;align-items:center;gap:6px;width:100%;padding:8px 8px;border-radius:12px;text-align:left}
.book-head:hover{background:var(--surface2)}
.book.active>.book-head{background:var(--accent-soft)}
.book-head .dot{width:10px;height:10px;border-radius:50%;flex:none}
.book-head .name{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book-head .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.book.active>.book-head .cnt{color:var(--accent)}
.side-foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.side-foot button{padding:6px 9px;border-radius:10px;background:var(--surface2);font-weight:700;font-size:12px;white-space:nowrap;flex:none}
.side-foot #footInfo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ---------- palette dropdown ---------- */
.pal{padding:10px 8px 4px;border-top:1px solid var(--line);position:relative}
.pal-trigger{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:12px;background:var(--surface2);text-align:left}
.pal-trigger:hover{filter:brightness(.97)}
.pal-trigger .swatches{display:flex;flex:none}
.pal-trigger .swatches i,.pal-opt .swatches i{display:block;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);margin-right:-5px}
.pal-trigger .lab{flex:1;min-width:0;font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-trigger .caret{width:12px;flex:none;color:var(--muted);transition:transform .2s}
.pal[open] .pal-trigger .caret{transform:rotate(180deg)}
.pal-menu{display:none;position:absolute;left:8px;right:8px;bottom:calc(100% - 4px);z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;max-height:52dvh;overflow:auto}
.pal[open] .pal-menu{display:block}
.pal-opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;text-align:left}
.pal-opt:hover{background:var(--surface2)}
.pal-opt .swatches{display:flex;flex:none}
.pal-opt .txt{flex:1;min-width:0}
.pal-opt .txt b{display:block;font-size:13px;font-weight:800;line-height:1.25;white-space:nowrap}
.pal-opt .txt small{display:block;font-size:11px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-opt .tick{width:14px;flex:none;color:var(--accent);opacity:0}
.pal-opt.sel .tick{opacity:1}
.pal-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px 6px}

/* ---------- library loader ---------- */
.book-head .src{font-size:10px;font-weight:800;padding:1px 5px;border-radius:5px;background:var(--blue-soft);color:var(--blue);flex:none}
.lib{padding:4px 8px 0}
.lib-btn{display:flex;align-items:center;gap:7px;width:100%;padding:8px 10px;border-radius:11px;font-size:13px;font-weight:700;color:var(--muted);border:1px dashed var(--line)}
.lib-btn:hover{color:var(--ink);background:var(--surface2);border-style:solid}
.lib-btn svg{width:15px;height:15px;flex:none}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,14,20,.5)}
.modal.show{display:flex}
.sheet{width:min(560px,100%);max-height:min(76dvh,640px);background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.sheet-top{display:flex;align-items:center;gap:10px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.sheet-top h2{margin:0;font-family:"Fredoka",sans-serif;font-weight:600;font-size:19px}
.sheet-top p{margin:2px 0 0;font-size:12px;color:var(--muted);font-weight:600}
.sheet-top .x{margin-left:auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.sheet-top .x:hover{background:var(--surface2);color:var(--ink)}
.sheet-body{padding:10px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.src-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;border:1px solid var(--line);text-align:left;width:100%}
.src-row:hover{background:var(--surface2)}
.src-row .ic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:16px}
.src-row .info{flex:1;min-width:0}
.src-row .info b{display:block;font-size:14px;font-weight:800}
.src-row .info small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-row .n{font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.src-row[disabled]{opacity:.5;pointer-events:none}
.sheet-note{margin:0;padding:10px 20px 16px;font-size:12px;color:var(--muted);font-weight:600;border-top:1px solid var(--line);line-height:1.5}
.sheet-note.warn{color:var(--bad)}
.sheet-foot{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.vbody{padding:16px 20px;gap:18px}
.vrow{display:flex;flex-direction:column;gap:8px}
.vrow label{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.vctl{display:flex;gap:8px}
.vctl select{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:700}
.vctl .btn{padding:9px 14px;font-size:14px;flex:none}
.vrate{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--muted)}
.vrate input{flex:1;accent-color:var(--accent)}
.vrate b{min-width:38px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.no-ipa{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;color:var(--muted)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:14px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;flex:none}
.tab{padding:8px 16px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tab svg{width:16px;height:16px}
.tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.crumb{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700;display:flex;gap:8px;align-items:center}
.crumb .pill{padding:3px 10px;border-radius:999px;background:var(--surface2);font-variant-numeric:tabular-nums}
.stage{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px}
.pane{display:none;flex:1;min-height:0;width:100%;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.pane.active{display:flex}

/* ---------- shared controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:14px;font-weight:800;font-size:15px;background:var(--surface);border:1px solid var(--line);transition:transform .08s,background .15s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.icon{width:46px;height:46px;padding:0;border-radius:50%}
.btn svg{width:20px;height:20px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);padding:8px 12px;border-radius:12px}
.toggle.on{color:var(--ink);background:var(--surface2)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.progress{width:min(560px,100%);height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}

/* ---------- flashcard ---------- */
.card-wrap{perspective:1600px;width:min(620px,100%);aspect-ratio:8/5;max-height:62dvh}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px;border:1px solid var(--line)}
.face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.face .word{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(44px,9vw,92px);line-height:1;letter-spacing:.5px;text-wrap:balance;text-align:center}
.face .hint{position:absolute;bottom:16px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.face .ipa{font-size:clamp(20px,3.6vw,32px);color:var(--muted)}
.face .zh{font-size:clamp(30px,6vw,56px);font-weight:800;line-height:1.1}
.face .tag{position:absolute;top:16px;left:20px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.face .idx{position:absolute;top:16px;right:20px;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.speak-btn{position:absolute;bottom:14px;right:16px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.speak-btn svg{width:22px;height:22px}
.speak-btn.playing{animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
/* ---------- 3D 挤出效果：九种材质 ---------- */
.fx-word{position:relative;display:inline-block}
.card-wrap[data-fx] .fx-word{
  color:var(--fx-side);
  text-shadow:.014em .014em 0 var(--fx-side),.028em .028em 0 var(--fx-side),.042em .042em 0 var(--fx-side),
    .056em .056em 0 var(--fx-side),.07em .07em 0 var(--fx-side),.084em .084em 0 var(--fx-side),
    .098em .098em 0 var(--fx-edge),.112em .112em .1em rgba(0,0,0,.32),.13em .14em .28em rgba(0,0,0,.28);
}
.card-wrap[data-fx] .fx-word::before{
  content:attr(data-word);position:absolute;left:0;top:0;width:100%;text-shadow:none;
  color:transparent;background-image:var(--fx-face);-webkit-background-clip:text;background-clip:text;
}
.card-wrap[data-fx] .face{background:var(--fx-card)}
.card-wrap[data-fx] .face .tag,.card-wrap[data-fx] .face .idx,.card-wrap[data-fx] .face .hint,.card-wrap[data-fx] .face .ipa{color:var(--fx-meta)}
.card-wrap[data-fx] .face .zh{color:var(--fx-ink)}
.card-wrap[data-fx] .speak-btn{background:var(--fx-btn,var(--accent));color:var(--fx-btn-ink,var(--accent-ink))}
.fx-opt .prev[data-fx]{background:var(--fx-card)}
.fx-opt .prev[data-fx] .fx-word{
  color:var(--fx-side);
  text-shadow:.02em .02em 0 var(--fx-side),.04em .04em 0 var(--fx-side),.06em .06em 0 var(--fx-side),.08em .08em 0 var(--fx-edge);
}
.fx-opt .prev[data-fx] .fx-word::before{
  content:attr(data-word);position:absolute;left:0;top:0;width:100%;text-shadow:none;
  color:transparent;background-image:var(--fx-face);-webkit-background-clip:text;background-clip:text;
}

[data-fx="classic"]{--fx-face:linear-gradient(170deg,color-mix(in srgb,var(--accent) 45%,#fff),var(--accent) 55%,color-mix(in srgb,var(--accent) 78%,#000));
  --fx-side:var(--ink);--fx-edge:var(--ink);--fx-card:var(--surface);--fx-meta:var(--muted);--fx-ink:var(--ink)}
[data-fx="gold"]{--fx-face:linear-gradient(172deg,#FFF6D2 0%,#F7DE8C 30%,#E3B23C 52%,#FBEFC0 58%,#C08A21 78%,#8A5F12 100%);
  --fx-side:#6A4A10;--fx-edge:#3A2705;--fx-card:#191510;--fx-meta:#B7A77F;--fx-ink:#F6ECD2;--fx-btn:#E3B23C;--fx-btn-ink:#1B1405}
[data-fx="rosegold"]{--fx-face:linear-gradient(172deg,#FFF0EA 0%,#F3C9BA 32%,#DE9B85 54%,#FBE2D8 60%,#B87560 82%,#8E5341 100%);
  --fx-side:#7A4636;--fx-edge:#4A281C;--fx-card:#F8EDE8;--fx-meta:#9A7466;--fx-ink:#3A231B}
[data-fx="steel"]{--fx-face:linear-gradient(172deg,#FBFDFF 0%,#DCE7F2 28%,#A5BCD3 50%,#F2F7FC 56%,#7A93AC 78%,#4E657D 100%);
  --fx-side:#33455A;--fx-edge:#1B2734;--fx-card:#E7EFF7;--fx-meta:#5D7A8C;--fx-ink:#1E2C3A}
[data-fx="candy"]{--fx-face:linear-gradient(172deg,#FFF0F7 0%,#FFC3DE 30%,#FF7FB6 52%,#FFE3F0 58%,#EE4E96 80%,#C92B70 100%);
  --fx-side:#8E1F52;--fx-edge:#5C0F33;--fx-card:#FFF4F9;--fx-meta:#A9738C;--fx-ink:#4A1230}
[data-fx="choco"]{--fx-face:linear-gradient(172deg,#E5C4A0 0%,#C79063 30%,#96603A 52%,#E0BA92 58%,#6E4222 80%,#4A2A13 100%);
  --fx-side:#331D0D;--fx-edge:#1D1007;--fx-card:#F7F0E7;--fx-meta:#8C7259;--fx-ink:#33200F}
[data-fx="jade"]{--fx-face:linear-gradient(172deg,#EFFBF5 0%,#B4EBD4 30%,#5FC7A2 52%,#DFF8EE 58%,#2E9B75 80%,#1B6B4F 100%);
  --fx-side:#14563E;--fx-edge:#0A3325;--fx-card:#ECF8F3;--fx-meta:#5D8A79;--fx-ink:#123B2B}
[data-fx="lava"]{--fx-face:linear-gradient(172deg,#FFE7B8 0%,#FFB65C 26%,#FF7A2F 50%,#FFD6A0 56%,#E8400F 80%,#A31F04 100%);
  --fx-side:#6E1808;--fx-edge:#390A03;--fx-card:#1A1210;--fx-meta:#B58F7E;--fx-ink:#FBE9DF;--fx-btn:#FF7A2F;--fx-btn-ink:#1A0A03}
[data-fx="graphite"]{--fx-face:linear-gradient(172deg,#C8D0DA 0%,#8C97A6 28%,#59636F 50%,#DCE3EB 56%,#39414B 80%,#20262E 100%);
  --fx-side:#171C23;--fx-edge:#0A0D11;--fx-card:#EDF1F5;--fx-meta:#6B7684;--fx-ink:#1B2029}

.fx{position:relative}
.fx-menu{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 8px);z-index:50;width:224px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;max-height:56dvh;overflow:auto}
.fx[open] .fx-menu{display:block}
.fx-opt{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border-radius:10px;text-align:left;font-size:13px;font-weight:700}
.fx-opt:hover{background:var(--surface2)}
.fx-opt .prev{width:40px;height:28px;border-radius:7px;flex:none;display:grid;place-items:center;background:var(--surface2);overflow:hidden}
.fx-opt .prev .fx-word{font-family:"Fredoka",sans-serif;font-size:16px;font-weight:600;line-height:1}
.fx-opt .tick{width:14px;flex:none;color:var(--accent);opacity:0;margin-left:auto}
.fx-opt.sel .tick{opacity:1}
/* emoji 图示 */
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.face .emo{font-size:clamp(30px,7vh,58px)}
.emo-lg{font-size:clamp(56px,12vh,96px);min-height:1em}
.type-meta .emo{font-size:26px}
.wcard .emo{position:absolute;top:26px;right:11px;font-size:22px}
body.no-emoji .emo{display:none!important}
.emo:empty{display:none}

/* 汉字卡正面的拼音 */
.face .py{font-size:clamp(20px,4.2vh,34px);font-weight:600;color:var(--muted);letter-spacing:.06em;line-height:1}
.card-wrap[data-fx] .face .py{color:var(--fx-meta)}

/* ---------- 全部单词 ---------- */
#pane-list{justify-content:flex-start;align-items:stretch;gap:12px;overflow:auto;padding:2px}
.list-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5;
  background:var(--ground);padding:2px 2px 10px}
.list-head b{font-family:"Fredoka",sans-serif;font-weight:600;font-size:20px}
.list-sub{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.list-search{margin-left:auto;width:min(240px,46vw);padding:9px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:600}
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:10px;padding-bottom:20px}
.wcard{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);text-align:left;position:relative;transition:border-color .15s,transform .08s}
.wcard:hover{border-color:var(--accent)}
.wcard:active{transform:scale(.98)}
.wcard.playing{border-color:var(--accent);background:var(--accent-soft)}
.wcard .w{font-family:"Fredoka",sans-serif;font-size:22px;font-weight:600;line-height:1.15;word-break:break-word}
.wcard .w.hz{font-size:40px;line-height:1.1}
.wcard .p{font-size:13px;color:var(--muted);font-weight:700}
.wcard .m{font-size:13.5px;font-weight:700}
.wcard .no{position:absolute;top:9px;right:11px;font-size:11px;font-weight:800;color:var(--muted);opacity:.7;font-variant-numeric:tabular-nums}
.list-empty{padding:30px;text-align:center;color:var(--muted);font-weight:700}
.nav{display:flex;align-items:center;gap:14px}
.nav .count{font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted);min-width:70px;text-align:center}

/* ---------- dictation ---------- */
.dict-card{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:36px 32px 28px;display:flex;flex-direction:column;align-items:center;gap:18px}
.dict-card .sound{display:flex;align-items:center;gap:16px;cursor:pointer;padding:14px 26px;border-radius:20px;background:var(--blue-soft);transition:background .15s}
.dict-card .sound:hover{filter:brightness(.97)}
.dict-card .sound .ipa{font-size:44px;color:var(--ink)}
.dict-card .sound .spk{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.dict-card .sound .spk svg{width:22px;height:22px}
.dict-card .zh-hint{color:var(--muted);font-weight:700;font-size:15px;min-height:22px}
.dict-input{width:min(420px,100%);font-family:"Fredoka",sans-serif;font-size:36px;font-weight:500;text-align:center;letter-spacing:.06em;padding:12px 18px;border-radius:16px;border:2px solid var(--line);background:var(--ground);color:var(--ink);transition:border-color .15s,background .15s}
.dict-input::placeholder{color:var(--muted);opacity:.5;font-size:22px;letter-spacing:0;font-family:"Nunito",sans-serif}
.dict-input.ok{border-color:var(--ok);background:var(--ok-soft)}
.dict-input.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.feedback{min-height:28px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}
.feedback .ans{font-family:"Fredoka",sans-serif;font-size:22px;letter-spacing:.04em;color:var(--ink)}
.score{display:flex;gap:18px;font-size:13px;font-weight:800;color:var(--muted)}
.score b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:15px}
.score .g{color:var(--ok)}.score .r{color:var(--bad)}

/* ---------- typing ---------- */
.type-card{width:min(760px,100%);background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:32px;display:flex;flex-direction:column;align-items:center;gap:22px;cursor:text}
.type-meta{display:flex;gap:14px;align-items:baseline;color:var(--muted);font-weight:700}
.type-meta .zh{font-size:22px;color:var(--ink);font-weight:800}
.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;font-family:"Fredoka",sans-serif;font-size:clamp(44px,7vw,72px);font-weight:500;line-height:1}
.letters span{position:relative;min-width:.62em;padding:6px 4px 10px;text-align:center;color:var(--muted);opacity:.55;border-bottom:4px solid var(--line);border-radius:4px;transition:color .1s,opacity .1s,border-color .1s}
.letters span.sp{opacity:.3;min-width:.42em;border-color:transparent}
.letters span.done{color:var(--ok);opacity:1;border-color:var(--ok)}
.letters span.wrong{color:var(--bad);opacity:1;border-color:var(--bad);background:var(--bad-soft)}
.letters span.cur{opacity:1;color:var(--ink);border-color:var(--accent)}
.letters span.cur::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.type-stats{display:grid;grid-template-columns:repeat(4,auto);gap:26px;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;text-align:center}
.type-stats b{display:block;font-size:22px;color:var(--ink);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.type-stats .g b{color:var(--ok)}.type-stats .r b{color:var(--bad)}
.type-hint{font-size:13px;color:var(--muted);font-weight:700}
.type-input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.done-banner{display:none;width:min(640px,100%);text-align:center;padding:18px;border-radius:18px;background:var(--ok-soft);color:var(--ok);font-weight:800;font-size:18px}
.done-banner.show{display:block}

/* ---------- phone landscape (flashcards) ---------- */
@media (max-height:520px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;gap:6px;padding:4px 8px}
  .brand{padding:4px 6px;border:0}
  .brand small,.tree-label,.side-foot,.book-head .cnt,.pal .pal-label{display:none}
  .pal{border-top:0;padding:0;flex:none}
  .lib{padding:0;flex:none}
  .lib-btn{padding:6px 8px;font-size:0;gap:0}
  .book-head .src{display:none}
  .sheet{max-height:88dvh}
  .pal-trigger{padding:6px 8px}.pal-trigger .lab{display:none}
  .pal-menu{left:auto;right:6px;bottom:auto;top:calc(100% + 4px);width:210px}
  .tree{display:flex;align-items:center;gap:4px;padding:0;overflow-x:auto;flex:1;min-width:0}
  .tgroup{display:flex;align-items:center;gap:4px;flex:none}
  .tgroup .tgroup-body,.tgroup.open .tgroup-body{display:flex;gap:4px;padding:0}
  .tree{flex-wrap:nowrap}
  .side{max-height:56px}
  .side{height:auto;flex:none}
  .main{min-height:0}
  .book{margin:0;flex:none}
  .book-head{padding:6px 10px}
  .topbar{padding:6px 12px}
  .tab{padding:5px 10px;font-size:13px}
  .stage{padding:8px 12px;gap:8px}
  .card-wrap{aspect-ratio:auto;height:100%;max-height:none;width:min(720px,100%);flex:1}
  .face{border-radius:20px;padding:14px}
  .face .word{font-size:clamp(40px,12vh,72px)}
  .face .zh{font-size:clamp(26px,9vh,48px)}
  .face .ipa{font-size:clamp(16px,4vh,24px)}
  .face .hint{display:none}
  .nav{gap:8px}.btn{padding:7px 14px;font-size:13px}.btn.icon{width:38px;height:38px}
  .progress{display:none}
  .flash-tools #fShuffle,.flash-tools #fAuto,.flash-tools .type-hint{display:none}
  .flash-tools{gap:0}
  .fx-menu{bottom:auto;top:calc(100% + 6px);max-height:44dvh}
}
@media (max-width:640px) and (min-height:521px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{border-right:0;border-bottom:1px solid var(--line);max-height:38dvh}
  .tab{padding:7px 10px;font-size:13px}
  .crumb{display:none}
}
@media (prefers-reduced-motion:reduce){
  .card{transition:none}.letters span.cur::after{animation:none}.speak-btn.playing{animation:none}
}

function prettyName(fn){
  if(fn.startsWith('dict_')){
    const p=fn.replace(/^dict_/,'').replace(/\.json$/,'').replace(/\.$/,'').split('_');
    return p.map(s=>s.replace(/^\d+[a-z]?$/i,'')).filter(Boolean).join(' ').replace(/\b\w/g,c=>c.toUpperCase())||fn;
  }
  return fn.replace(/^txt_/,'').replace(/\.txt$/,'');
}
function bookFromGroups(id,name,desc,groups){
  const words=[];
  for(const g in groups) groups[g].forEach(it=>{
    const en=Array.isArray(it)?it[0]:it.english, zh=Array.isArray(it)?it[1]:(it.chinese||'');
    if(en) words.push({en:String(en).trim(),ipa:'',zh:String(zh||'').trim(),g});
  });
  return {id,name,short:name.length>6?name.slice(0,6):name,color:'var(--blue)',desc:desc||'',words,src:'GitHub'};
}
function bookFromText(id,name,text){
  const seen=new Set(),words=[];
  text.split(/[^A-Za-z'’-]+/).forEach(w=>{ const k=w.replace(/^['’-]+|['’-]+$/g,''); if(k.length>1&&!seen.has(k.toLowerCase())){seen.add(k.toLowerCase());words.push({en:k,ipa:'',zh:''});} });
  return {id,name,short:name.slice(0,6),color:'var(--blue)',desc:'纯文本词表 · 无中文释义',words,src:'文本'};
}

  b.innerHTML=`<span class="ic">${icon}</span><span class="info"><b></b><small></small></span>`+(count!=null?`<span class="n">${count} 词</span>`:'');

function showSnapshot(reason){
  $('libList').innerHTML='';
  Object.entries(SNAPSHOT).forEach(([fn,d])=>{
    const n=Object.values(d.groups).reduce((a,v)=>a+v.length,0);
    libRow('📗',d.fileName||prettyName(fn),d.description||fn,n,()=>addBook(bookFromGroups('snap:'+fn,d.fileName||prettyName(fn),d.description,d.groups)));
  });
  libNote(reason+'下面是随应用打包的同一批词库副本，可直接使用；也可以打开本地 .json / .txt 文件。',false);
}
async function loadLibrary(){
  $('libList').innerHTML='';
  const wait=libRow('<span class="spin"></span>','正在连接 GitHub…',REPO_API,null,null,true);
  try{
    const r=await fetch(REPO_API,{headers:{'Accept':'application/vnd.github+json'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    const files=data.filter(i=>i.type==='file'&&(i.name.startsWith('dict_')||i.name.startsWith('txt_')));
    if(!files.length) throw new Error('目录里没有 dict_ / txt_ 文件');
    $('libList').innerHTML='';
    files.forEach(f=>{
      const isJson=f.name.endsWith('.json');
      libRow(isJson?'📗':'📄',prettyName(f.name),f.name+' · '+(f.size/1024).toFixed(1)+' KB',null,()=>fetchBook(f.name,isJson));
    });
    libNote('点任意一条即可加入左侧书架。词库来自 cocobotech/xiaobao 的 apps/Vocabulary 目录，与 typing/adv.html 使用的是同一份数据。',false);
  }catch(err){
    wait.remove();
    showSnapshot('无法连接 GitHub（'+err.message+'）——这一般是页面所在环境禁止跨站请求。');
  }
}
async function fetchBook(fname,isJson){
  libNote('正在下载 '+fname+' …',false);
  try{
    const r=await fetch(REPO_RAW+encodeURIComponent(fname)); if(!r.ok) throw new Error('HTTP '+r.status);
    if(isJson){ const d=await r.json(); addBook(bookFromGroups('gh:'+fname,d.fileName||prettyName(fname),d.description,d.groups||{})); }
    else { addBook(bookFromText('gh:'+fname,prettyName(fname),await r.text())); }
  }catch(err){ libNote('下载失败：'+err.message,true); }
}
function openLib(){ $('libModal').classList.add('show'); loadLibrary(); }

let actx;
function ctx(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch{} } if(actx&&actx.state==='suspended') actx.resume(); return actx; }
function tone(freq,dur=0.08,type='sine',vol=0.18,when=0){
  const c=ctx(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,c.currentTime+when);
  g.gain.exponentialRampToValueAtTime(vol,c.currentTime+when+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+when+dur);
  o.connect(g).connect(c.destination);o.start(c.currentTime+when);o.stop(c.currentTime+when+dur+0.02);
}

/* ================= 朗读引擎：自动挑选最自然的人声 =================
   优先级：Edge 在线 Natural/Neural 声音 > Apple 增强/高级声音 > Google 声音 > 系统普通声音
   声音列表是异步加载的，监听 voiceschanged，并轮询兜底（Safari 有时不触发事件）。 */
const VOICE={ en:null, zh:null, list:{en:[],zh:[]},
  pref:store.get('voicePref',{en:'',zh:'',rateEn:0.9,rateZh:0.8}) };
const NOVELTY=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Pipe Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Princess|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
function voiceScore(v,lang){
  const n=v.name, l=(v.lang||'').replace('_','-');
  let s=0;
  if(lang==='en'){
    if(!/^en/i.test(l)) return -1e9;
    if(/en-US/i.test(l)) s+=30; else if(/en-GB/i.test(l)) s+=18; else s+=6;
    if(/Aria|Jenny|Ava|Andrew|Emma|Brian|Michelle|Guy|Samantha|Allison|Susan|Zoe|Evan|Nathan|Joelle/i.test(n)) s+=25;
  }else{
    if(!/zh|cmn/i.test(l)) return -1e9;
    if(/zh-HK|yue|Cantonese|粤/i.test(l+n)) s-=400;          // 粤语不要
    if(/zh-CN|cmn-Hans|zh-Hans/i.test(l)) s+=30; else if(/zh-TW|zh-Hant/i.test(l)) s+=10;
    if(/Xiaoxiao|Xiaoyi|Yunxi|Yunjian|Yunyang|Xiaochen|Xiaohan|Xiaomo|Tingting|Lili|Yu-shu|Meijia|普通话/i.test(n)) s+=25;
  }
  if(/Natural|Neural|Online/i.test(n)) s+=120;                // Edge 在线自然声音
  if(/Premium|Enhanced|高级|增强|Siri/i.test(n)) s+=90;          // Apple 下载的高品质声音
  if(/Google/i.test(n)) s+=60;                                 // Chrome 的 Google 声音
  if(v.localService===false) s+=15;
  if(/eSpeak|espeak/i.test(n)) s-=150;
  if(NOVELTY.test(n)) s-=300;                                  // macOS 的搞怪声音
  if(v.default) s+=2;
  return s;
}
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices(); if(!vs.length) return;
  ['en','zh'].forEach(lang=>{
    VOICE.list[lang]=vs.map(v=>({v,s:voiceScore(v,lang)})).filter(x=>x.s>-1e8).sort((a,b)=>b.s-a.s).map(x=>x.v);
    const want=VOICE.pref[lang];
    VOICE[lang]=(want&&VOICE.list[lang].find(v=>v.voiceURI===want||v.name===want))||VOICE.list[lang][0]||null;
  });
  if(typeof renderVoicePanel==='function') renderVoicePanel();
}
if('speechSynthesis' in window){
  loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;
  let tries=0; const poll=setInterval(()=>{ loadVoices(); if(VOICE.list.en.length||++tries>20) clearInterval(poll); },250);
}
let _utter=null, _speakTimer=null;   // 保持引用，避免 Chrome 回收后 onend 不触发
function speak(text,onend,lang){
  if(!('speechSynthesis' in window)) return;
  const zh=lang==='zh';
  speechSynthesis.cancel(); clearTimeout(_speakTimer);
  const u=new SpeechSynthesisUtterance(text);
  u.lang=zh?'zh-CN':'en-US';
  u.rate=zh?VOICE.pref.rateZh:VOICE.pref.rateEn;
  u.pitch=1; u.volume=1;
  const v=zh?VOICE.zh:VOICE.en; if(v){ u.voice=v; u.lang=v.lang; }
  if(onend){ u.onend=onend; u.onerror=onend; }
  _utter=u;
  // cancel 之后立刻 speak，Chrome 偶尔会吞掉这一句，稍等一帧再读
  _speakTimer=setTimeout(()=>{ speechSynthesis.speak(u); if(speechSynthesis.paused) speechSynthesis.resume(); },40);
}
function speakWord(w,onend){ speak(w.hz||w.en,onend,w.hz?'zh':'en'); }

  const p=PALETTES.find(x=>x.id===id)||PALETTES[0];
  let el=$('palStyle'); if(!el){ el=document.createElement('style'); el.id='palStyle'; document.body.appendChild(el); }
  el.textContent=`:root{${palVars(p.light)}}`
    +`@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${palVars(p.dark)}}}`
    +`:root[data-theme="dark"]{${palVars(p.dark)}}`;
  store.set('pal',p.id);
  const sw=t=>`<i style="background:${t.accent}"></i><i style="background:${t.blue}"></i><i style="background:${t.ink}"></i>`;
  $('palTrigSw').innerHTML=sw(p.light); $('palTrigLab').textContent=p.name;
  document.querySelectorAll('.pal-opt').forEach(o=>o.classList.toggle('sel',o.dataset.id===p.id));
}
function renderPalettes(){
  const m=$('palMenu');
  PALETTES.forEach(p=>{
    const b=document.createElement('button'); b.className='pal-opt'; b.dataset.id=p.id; b.setAttribute('role','option');
    b.innerHTML=`<span class="swatches"><i style="background:${p.light.accent}"></i><i style="background:${p.light.blue}"></i><i style="background:${p.light.ink}"></i></span>`
      +`<span class="txt"><b>${p.cn}</b><small>${p.note}</small></span>`
      +`<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4 10-10"/></svg>`;
    b.onclick=()=>{ applyPalette(p.id); $('pal').removeAttribute('open'); $('palTrigger').setAttribute('aria-expanded','false'); };
    m.appendChild(b);
  });
  $('palTrigger').onclick=e=>{ e.stopPropagation(); const o=$('pal').hasAttribute('open'); $('pal').toggleAttribute('open',!o); $('palTrigger').setAttribute('aria-expanded',String(!o)); };
  document.addEventListener('click',e=>{ if(!e.target.closest('#pal')){ $('pal').removeAttribute('open'); $('palTrigger').setAttribute('aria-expanded','false'); } });
}

function renderTree(){
  const t=$('tree'); t.innerHTML='';
  const groups=[{cat:'en',label:'英语单词'},{cat:'sup',label:'英语补充组'},{cat:'zh',label:'汉字'}];
  const closed=store.get('closedGroups',[]);
  groups.forEach(g=>{
    const listed=BOOKS.filter(b=>(b.cat||'en')===g.cat);
    if(!listed.length) return;
    const open=!closed.includes(g.cat)||listed.some(b=>b.id===bookId);
    const sec=document.createElement('div'); sec.className='tgroup'+(open?' open':''); sec.dataset.cat=g.cat;
    const h=document.createElement('button'); h.className='tree-label'; h.setAttribute('aria-expanded',String(open));
    h.innerHTML=`<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg><span>${g.label}</span><em>${listed.length}</em>`;
    h.onclick=()=>{
      const now=!sec.classList.contains('open');
      sec.classList.toggle('open',now); h.setAttribute('aria-expanded',String(now));
      const c=store.get('closedGroups',[]).filter(x=>x!==g.cat);
      if(!now) c.push(g.cat);
      store.set('closedGroups',c);
    };
    sec.appendChild(h);
    const body=document.createElement('div'); body.className='tgroup-body';
    listed.forEach(bk=>{
      const el=document.createElement('div'); el.className='book'+(bk.id===bookId?' active':''); el.dataset.id=bk.id;
      el.innerHTML=`<button class="book-head"><span class="dot" style="background:${bk.color}"></span><span class="name"></span>${bk.src?`<span class="src">${bk.src}</span>`:''}<span class="cnt">${bk.words.length}</span></button>`;
      el.querySelector('.name').textContent=bk.name; el.querySelector('.book-head').title=bk.name+(bk.desc?' — '+bk.desc:'');
      el.querySelector('.book-head').onclick=()=>{ if(bk.id!==bookId) selectBook(bk.id); };

}

const flash={
  order:[], i:0, shuffle:store.get('shuffle',false), auto:store.get('auto',true), flipped:false,
  reset(){ this.order=book().words.map((_,i)=>i); if(this.shuffle) shuffleArr(this.order); this.i=0; this.flipped=false; this.render(); },
  go(idx){ const p=this.order.indexOf(idx); this.i=p<0?0:p; this.flipped=false; this.render(); },
  cur(){ return book().words[this.order[this.i]]; },
  render(){
    const w=this.cur(), n=this.order.length;
    $('card').classList.toggle('flipped',this.flipped);
    const disp=w.hz||w.en;
    $('fWord').textContent=disp; $('bWord').textContent=disp;
    $('fWord').dataset.word=disp; $('bWord').dataset.word=disp;
    $('fWord').classList.toggle('hz',!!w.hz); $('bWord').classList.toggle('hz',!!w.hz);
    $('fEmo').textContent=w.em||''; $('bEmo').textContent=w.em||'';
    $('fPy').textContent=w.hz?(w.ipa||''):''; $('fPy').style.display=w.hz&&w.ipa?'':'none';
    $('bIpa').textContent=w.ipa||''; $('bIpa').style.display=w.ipa?'':'none';
    $('bZh').textContent=w.zh||'（本词库无中文释义）'; $('bZh').style.opacity=w.zh?1:.5;
    $('fTag').textContent=w.g||book().short; $('fIdx').textContent=$('bIdx').textContent=(this.i+1)+' / '+n;
    $('fCount').textContent=(this.i+1)+' / '+n; $('fProg').style.width=((this.i+1)/n*100)+'%';
    $('fShuffle').classList.toggle('on',this.shuffle); $('fAuto').classList.toggle('on',this.auto);
    markCurrentWord(this.order[this.i]);
  },
  flip(){ this.flipped=!this.flipped; $('card').classList.toggle('flipped',this.flipped); if(this.flipped&&this.auto) this.say(); },
  say(){ const b=$('fSpeakBack'),f=$('fSpeakFront'); b.classList.add('playing');f.classList.add('playing'); speakWord(this.cur(),()=>{b.classList.remove('playing');f.classList.remove('playing')}); },
  next(){ this.i=(this.i+1)%this.order.length; this.flipped=false; this.render(); },
  prev(){ this.i=(this.i-1+this.order.length)%this.order.length; this.flipped=false; this.render(); }
};
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}}
$('card').onclick=e=>{ if(e.target.closest('.speak-btn')) return; flash.flip(); };
$('card').onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();flash.flip();} };
$('fSpeakFront').onclick=$('fSpeakBack').onclick=e=>{e.stopPropagation();flash.say();};
$('fNext').onclick=()=>flash.next(); $('fPrev').onclick=()=>flash.prev();
$('fShuffle').onclick=()=>{flash.shuffle=!flash.shuffle;store.set('shuffle',flash.shuffle);flash.reset();};
$('fAuto').onclick=()=>{flash.auto=!flash.auto;store.set('auto',flash.auto);flash.render();};
let tx=0; $('card').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});

const dict={
  order:[], i:0, right:0, wrong:0, answered:false, hint:store.get('dhint',false),
  reset(){ this.order=book().words.map((_,i)=>i); shuffleArr(this.order); this.i=0; this.right=0; this.wrong=0; this.load(); },
  cur(){ return book().words[this.order[this.i]]; },
  load(){
    this.answered=false; const w=this.cur();
    $('dEmo').textContent=w.em||'';
    if(w.ipa&&!w.hz) $('dIpa').textContent=w.ipa; else $('dIpa').innerHTML='<span class="no-ipa">点这里再听一次</span>';
    $('dZh').textContent=this.hint?(w.zh||''):''; $('dHint').classList.toggle('on',this.hint);
    const inp=$('dInput'); inp.value=''; inp.className='dict-input'; inp.disabled=false;
    $('dFeedback').className='feedback'; $('dFeedback').textContent='';
    $('dPos').textContent=this.i+1; $('dTotal').textContent=this.order.length; $('dRight').textContent=this.right; $('dWrong').textContent=this.wrong;
    if(mode==='dict'){ inp.focus(); setTimeout(()=>{ if(mode==='dict'&&this.i>=0&&!this.answered) this.say(); },260); }
  },
  check(){
    if(this.answered) return this.next();
    const inp=$('dInput'), val=inp.value.trim().toLowerCase(); if(!val) return;
    const w=this.cur(); this.answered=true;
    if(val===w.en.toLowerCase()){ this.right++; inp.className='dict-input ok'; $('dFeedback').className='feedback ok'; $('dFeedback').innerHTML='✓ 正确！<span class="ans'+(w.hz?' hz':'')+'">'+(w.hz||w.en)+'</span> '+(w.hz?w.ipa+' ':'')+w.zh; sfx.ok(); speakWord(w); setTimeout(()=>{ if(this.answered) this.next(); },1400); }
    else { this.wrong++; inp.className='dict-input bad'; $('dFeedback').className='feedback bad'; $('dFeedback').innerHTML='✗ 不对，正确是 <span class="ans'+(w.hz?' hz':'')+'">'+(w.hz||w.en)+'</span> <b>'+w.en+'</b> '+w.zh; sfx.bad(); }
    $('dRight').textContent=this.right; $('dWrong').textContent=this.wrong;
  },
  reveal(){ const w=this.cur(); if(!this.answered){this.wrong++;this.answered=true;$('dWrong').textContent=this.wrong;} $('dFeedback').className='feedback bad'; $('dFeedback').innerHTML='答案：<span class="ans'+(w.hz?' hz':'')+'">'+(w.hz||w.en)+'</span> <b>'+w.en+'</b> '+w.zh; speakWord(w); },
  next(){ this.i++; if(this.i>=this.order.length){ this.finish(); return; } this.load(); },
  finish(){ const n=this.order.length; sfx.win(); $('dFeedback').className='feedback ok'; $('dFeedback').textContent=`🎉 全部完成！${n} 个词，正确 ${this.right}，错误 ${this.wrong}。按回车重新开始。`; $('dInput').disabled=true; this.i=-1; this.answered=true; $('dIpa').textContent='/ˈfɪnɪʃt/'; $('dZh').textContent='完成'; },
  say(){ speakWord(this.cur()); }
};

$('dSound').onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();dict.say();} };
$('dInput').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); if(dict.i<0){dict.reset();return;} dict.check(); } if(e.key==='Escape'){dict.say();} };

/* ================= 打字练习 ================= */
const typing={
  order:[], i:0, pos:0, ok:0, bad:0, start:null, chars:0, sound:store.get('tsound',true), wrongAt:false,
  reset(){ this.order=book().words.map((_,i)=>i); this.i=0; this.ok=0; this.bad=0; this.chars=0; this.start=null; $('tDone').className='done-banner'; this.load(); },
  cur(){ return book().words[this.order[this.i]]; },
  load(){
    this.pos=0; this.wrongAt=false; const w=this.cur();
    $('tEmo').textContent=w.em||''; $('tPos').textContent=(this.i+1)+' / '+this.order.length; $('tZh').textContent=w.hz||w.zh||w.en; $('tZh').classList.toggle('hz',!!w.hz); $('tIpa').textContent=w.hz?w.zh:(w.ipa||'');
    $('tLetters').innerHTML=w.en.split('').map(c=>c===' '?'<span data-sp="1" class="sp">·</span>':`<span>${c}</span>`).join('');
    $('tInput').value=''; this.paint(); this.stats();
  },
  paint(){ [...$('tLetters').children].forEach((s,k)=>{ const st=k<this.pos?'done':(k===this.pos?(this.wrongAt?'cur wrong':'cur'):''); s.className=(s.dataset.sp?'sp ':'')+st; }); },
  key(ch){
    if(this.i<0) return;
    const w=this.cur().en; if(!this.start) this.start=Date.now();
    if(ch.toLowerCase()===w[this.pos].toLowerCase()){
      this.ok++; this.chars++; this.pos++; this.wrongAt=false; if(this.sound) sfx.click();
      if(this.pos>=w.length){ this.paint(); if(this.sound) sfx.ok(); speakWord(this.cur()); setTimeout(()=>this.nextWord(),650); return; }
    } else { this.bad++; this.wrongAt=true; if(this.sound) sfx.buzz(); }
    this.paint(); this.stats();
  },
  nextWord(){ this.i++; if(this.i>=this.order.length){ this.finish(); return; } this.load(); },
  stats(){
    const total=this.ok+this.bad; $('tOk').textContent=this.ok; $('tBad').textContent=this.bad;
    $('tAcc').textContent=(total?Math.round(this.ok/total*100):100)+'%';
    const mins=this.start?(Date.now()-this.start)/60000:0; $('tWpm').textContent=mins>0.02?Math.round(this.chars/5/mins):0;
  },
  finish(){ this.stats(); sfx.win(); const b=$('tDone'); b.textContent=`🏆 打完啦！${this.order.length} 个词 · 准确率 ${$('tAcc').textContent} · ${$('tWpm').textContent} WPM。点「重新开始」再来一遍。`; b.className='done-banner show'; $('tLetters').innerHTML=''; $('tZh').textContent='完成'; $('tIpa').textContent=''; this.i=-1; }
};
$('tInput').addEventListener('input',e=>{ const v=e.target.value; e.target.value=''; if(v) [...v].forEach(c=>{ if(/^[a-zA-Z' \-’]$/.test(c)) typing.key(c); }); });
$('tInput').onkeydown=e=>{ if(e.key==='Enter'&&typing.i<0) typing.reset(); };
$('typeCard').onclick=()=>$('tInput').focus();
$('tSkip').onclick=e=>{e.stopPropagation(); if(typing.i>=0){typing.nextWord();} $('tInput').focus();};

/* ================= 全部单词 ================= */
const list={
  q:'', playing:false, timer:null,
  reset(){ this.stop(); this.q=''; const s=$('lSearch'); if(s) s.value=''; this.render(); },
  render(){
    const b=book(), zh=b.lang==='zh', q=this.q.trim().toLowerCase();
    $('lTitle').textContent=b.name;
    const rows=b.words.map((w,i)=>({w,i})).filter(({w})=>!q||w.en.toLowerCase().includes(q)||(w.zh||'').includes(q)||(w.hz||'').includes(q)||(w.ipa||'').toLowerCase().includes(q));
    $('lSub').textContent=(q?rows.length+' / ':'')+b.words.length+(zh?' 字':' 词');
    const g=$('lGrid');
    if(!rows.length){ g.innerHTML='<div class="list-empty">没有匹配的内容</div>'; return; }
    g.innerHTML='';
    rows.forEach(({w,i})=>{
      const c=document.createElement('button'); c.className='wcard'; c.dataset.i=i;
      c.innerHTML=`<span class="no">${i+1}</span><span class="emo">${w.em||''}</span><span class="w${w.hz?' hz':''}"></span><span class="p"></span><span class="m"></span>`;
      c.querySelector('.w').textContent=w.hz||w.en;
      c.querySelector('.p').textContent=w.ipa||'';
      c.querySelector('.m').textContent=w.zh||'';
      c.onclick=()=>{ this.stop(); this.flash(c); speakWord(w); };
      c.ondblclick=()=>{ setMode('flash'); flash.go(i); };
      g.appendChild(c);
    });
  },
  flash(c){ document.querySelectorAll('.wcard.playing').forEach(x=>x.classList.remove('playing')); c.classList.add('playing'); },
  play(){
    const cards=[...$('lGrid').querySelectorAll('.wcard')];
    if(!cards.length) return;
    this.playing=true; $('lPlay').textContent='■ 停止朗读'; $('lPlay').classList.add('primary');
    let k=0;
    const step=()=>{
      if(!this.playing||k>=cards.length){ this.stop(); return; }
      const c=cards[k++]; this.flash(c); c.scrollIntoView({block:'nearest',behavior:'smooth'});
      speakWord(book().words[+c.dataset.i],()=>{ this.timer=setTimeout(step,450); });
    };
    step();
  },
  stop(){
    this.playing=false; clearTimeout(this.timer);
    if('speechSynthesis' in window) speechSynthesis.cancel();
    const p=$('lPlay'); if(p){ p.textContent='▶︎ 依次朗读'; p.classList.remove('primary'); }
    document.querySelectorAll('.wcard.playing').forEach(x=>x.classList.remove('playing'));
  }
};
$('lSearch').oninput=e=>{ list.q=e.target.value; list.render(); };
$('lPlay').onclick=()=>{ list.playing?list.stop():list.play(); };

    const sel=$(lang==='en'?'vEn':'vZh'); const list=VOICE.list[lang];
    sel.innerHTML='';
    if(!list.length){ const o=document.createElement('option'); o.textContent=lang==='en'?'本机没有英文声音':'本机没有中文普通话声音'; sel.appendChild(o); sel.disabled=true; return; }
    sel.disabled=false;
    const auto=document.createElement('option'); auto.value=''; auto.textContent='自动（'+voiceLabel(list[0],lang).replace(/^[★☆] /,'')+'）'; sel.appendChild(auto);
    list.forEach(v=>{ const o=document.createElement('option'); o.value=v.voiceURI||v.name; o.textContent=voiceLabel(v,lang); sel.appendChild(o); });
    sel.value=VOICE.pref[lang]||'';
  });
  $('vEnRate').value=VOICE.pref.rateEn; $('vEnRateV').textContent=(+VOICE.pref.rateEn).toFixed(2);
  $('vZhRate').value=VOICE.pref.rateZh; $('vZhRateV').textContent=(+VOICE.pref.rateZh).toFixed(2);
  const natural=[...VOICE.list.en,...VOICE.list.zh].some(v=>/Natural|Neural|Online|Premium|Enhanced/i.test(v.name));
  $('voiceNote').textContent=natural
    ? '★ 表示高品质自然人声（Edge 的 Natural 在线声音、Apple 的增强/高级声音），已自动优先使用。'
    : '当前浏览器只提供普通系统声音。想要更自然的朗读：Windows 上用 Microsoft Edge 打开本页，会出现 “Xiaoxiao Online (Natural)”、“Aria/Jenny Online (Natural)” 等在线自然声音；Mac / iPhone 可在「系统设置 › 辅助功能 › 朗读内容 › 声音」里下载 Tingting、Ava 等“增强/高级”声音。';
}

$('voiceClose').onclick=()=>$('voiceModal').classList.remove('show');

$('vZhTest').onclick=()=>speak('春天来了，小草绿了，花儿开了。',null,'zh');
$('vEnRate').oninput=e=>{ VOICE.pref.rateEn=+e.target.value; $('vEnRateV').textContent=(+e.target.value).toFixed(2); store.set('voicePref',VOICE.pref); };
$('vZhRate').oninput=e=>{ VOICE.pref.rateZh=+e.target.value; $('vZhRateV').textContent=(+e.target.value).toFixed(2); store.set('voicePref',VOICE.pref); };
$('vEnRate').onchange=()=>speak('butterfly',null,'en');
$('vZhRate').onchange=()=>speak('蝴蝶',null,'zh');

/* ================= 全局键盘 ================= */
document.addEventListener('keydown',e=>{
  if(mode!=='flash') return;
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight'){flash.next()} else if(e.key==='ArrowLeft'){flash.prev()} else if(e.key===' '){e.preventDefault();flash.flip()} else if(e.key.toLowerCase()==='s'){flash.say()}
});
document.addEventListener('pointerdown',()=>ctx(),{once:true});

/* ================= 主题 ================= */
$('themeBtn').onclick=()=>{ const r=document.documentElement; const cur=r.getAttribute('data-theme'); const sysDark=matchMedia('(prefers-color-scheme: dark)').matches; const isDark=cur?cur==='dark':sysDark; r.setAttribute('data-theme',isDark?'light':'dark'); store.set('theme',isDark?'light':'dark'); };
(()=>{ const t=store.get('theme',null); if(t) document.documentElement.setAttribute('data-theme',t); })();

$('libBtn').onclick=openLib;
$('libClose').onclick=closeLib;
$('libRefresh').onclick=loadLibrary;
$('libModal').onclick=e=>{ if(e.target===$('libModal')) closeLib(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeLib(); });
$('libUpload').onclick=()=>$('libFile').click();
$('libFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=ev=>{
    try{
      if(f.name.endsWith('.json')){ const d=JSON.parse(ev.target.result); addBook(bookFromGroups('file:'+f.name,d.fileName||f.name.replace(/\.json$/,''),d.description,d.groups||{})); }
      else addBook(bookFromText('file:'+f.name,f.name.replace(/\.txt$/,''),ev.target.result));
    }catch(err){ libNote('这个文件读不出来：'+err.message,true); }
  };
  rd.readAsText(f); e.target.value='';
};

$('dEmoji').onclick=()=>applyEmoji(!emojiOn);
applyEmoji(emojiOn);
renderPalettes(); applyPalette(store.get('pal','clem')); renderFx(); applyFx(fxId); renderTree(); selectBook(bookId); $('tSound').classList.toggle('on',typing.sound); setMode(mode);
